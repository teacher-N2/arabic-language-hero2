<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>تحدي اللغة العربية | نسخة الجوال المضبوطة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#120416;color:white}
button{font-family:inherit;cursor:pointer}
body{overflow:hidden}
.desktopStage{position:fixed;inset:0;width:100vw;height:100svh;overflow:hidden;background:#120416}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,0) 48%,rgba(18,4,22,.20) 86%,rgba(18,4,22,.50) 100%);pointer-events:none}
.uiLayer{position:absolute;inset:0;z-index:8}
.portal{fill:rgba(255,255,255,.005);stroke:rgba(255,223,130,0);stroke-width:3;cursor:pointer;transition:.18s}
.portal:hover{fill:rgba(255,236,190,.10);stroke:rgba(255,223,130,.95);filter:drop-shadow(0 0 14px rgba(255,200,80,.95))}
.scorebar{position:absolute;top:10px;right:10px;z-index:12;background:rgba(58,7,31,.82);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 14px;font-weight:900;font-size:clamp(12px,1.25vw,18px)}
.caption{position:absolute;bottom:10px;right:50%;transform:translateX(50%);z-index:12;background:rgba(58,7,31,.76);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.55rem 1rem;font-weight:900;font-size:clamp(11px,1.1vw,16px);white-space:nowrap}
.mobileApp{display:none}
.panel{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(22,5,18,.78);backdrop-filter:blur(7px);padding:16px}
.panel.show{display:flex}
.card{width:min(920px,96vw);max-height:92svh;overflow:auto;background:linear-gradient(135deg,#fff8ec,#fff);color:#3b071f;border-radius:30px;padding:24px;border:4px solid #f5b942;box-shadow:0 30px 90px rgba(0,0,0,.52)}
.card h1{margin:0;color:#8f1d4b;font-size:clamp(30px,5vw,54px)}
.card p{font-size:clamp(16px,2vw,20px);line-height:2;color:#5c3143}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{background:#fce7f3;color:#8f1d4b;border-radius:999px;padding:8px 13px;font-weight:900}
.question{font-size:clamp(21px,3vw,32px);line-height:1.7;font-weight:900;margin:16px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{border:2px solid #f1ccda;background:white;color:#3b071f;border-radius:18px;padding:16px;font-size:clamp(16px,2vw,18px);font-weight:900;text-align:right}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{display:none;margin-top:14px;border-radius:18px;padding:14px;font-size:clamp(16px,2vw,18px);font-weight:900;line-height:1.8}
.feedback.good{display:block;background:#dcfce7;color:#166534}
.feedback.bad{display:block;background:#fee2e2;color:#991b1b}
.tipBox{background:#fff7ed;border:1px solid #f5d4a1;border-radius:16px;padding:12px;margin-top:14px;color:#6b1235;line-height:1.8;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:none;border-radius:18px;padding:14px 24px;font-size:17px;font-weight:900}
.primary{background:linear-gradient(135deg,#8f1d4b,#c92d68);color:white}
.secondary{background:#f1d5df;color:#6b1235}
.confetti{position:fixed;top:-30px;font-size:28px;z-index:200;pointer-events:none;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(max-width:760px), (pointer:coarse) and (max-width:900px){
  body{overflow:auto;background:linear-gradient(180deg,#18051c,#3b071f 45%,#fff3df 45%,#fff8ed)}
  .desktopStage{display:none}
  .mobileApp{display:block;min-height:100svh;padding:12px;padding-bottom:26px}
  .mobileHero{position:relative;border-radius:26px;overflow:hidden;min-height:42svh;background:#120416;box-shadow:0 18px 38px rgba(0,0,0,.28)}
  .mobileHero img{width:100%;height:100%;min-height:42svh;object-fit:cover;object-position:33% center;display:block}
  .mobileOverlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,4,22,.10),rgba(18,4,22,.55))}
  .mobileTitle{position:absolute;right:14px;left:14px;bottom:14px;text-align:center}
  .mobileTitle h1{margin:0;font-size:32px;line-height:1.3;color:#ffe39b;text-shadow:0 3px 12px #3b071f}
  .mobileTitle p{margin:8px 0 0;font-size:15px;line-height:1.7;color:white;font-weight:900}
  .mobileStats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .mStat{background:white;color:#6b1235;border-radius:18px;padding:13px;text-align:center;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .mStat strong{display:block;font-size:24px;color:#8f1d4b}
  .mobileCaption{background:#fff8ec;color:#6b1235;border:2px solid #f5b942;border-radius:18px;padding:12px;line-height:1.8;font-weight:900;margin:12px 0;text-align:center}
  .mobileGates{display:grid;grid-template-columns:1fr;gap:10px}
  .mGate{border:none;border-radius:22px;padding:16px 18px;text-align:right;color:white;font-weight:900;box-shadow:0 12px 26px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;justify-content:space-between}
  .mGate span{font-size:34px}
  .mGate b{font-size:22px;display:block}
  .mGate small{font-size:14px;line-height:1.8;opacity:.95}
  .g1{background:linear-gradient(135deg,#7c3aed,#4c1d95)} .g2{background:linear-gradient(135deg,#2563eb,#0f4c81)} 
  .g3{background:linear-gradient(135deg,#15803d,#14532d)} .g4{background:linear-gradient(135deg,#f97316,#9a3412)} 
  .g5{background:linear-gradient(135deg,#ec4899,#831843)} .g6{background:linear-gradient(135deg,#8f1d4b,#c92d68)}
  .panel{align-items:flex-end;padding:0;background:rgba(22,5,18,.62)}
  .card{width:100%;max-height:88svh;border-radius:26px 26px 0 0;border-left:0;border-right:0;border-bottom:0;padding:18px}
  .options{grid-template-columns:1fr}
  .actions .btn{width:100%}
}
</style>
</head>

  <img src="assets/game_world.png?v=mobilefix2" class="bg" alt="واجهة تحدي اللغة العربية">

    <polygon class="portal" onclick="openGate('mixed')" points="535,320 1010,320 1058,395 505,395" />
    <polygon class="portal" onclick="openGate('spelling')" points="260,568 420,548 455,850 238,850" />

    <polygon class="portal" onclick="openGate('reading')" points="1045,550 1220,575 1240,850 1025,850" />
    <polygon class="portal" onclick="openReward()" points="28,760 245,760 245,835 28,835" />
  </svg>
</main>
<section class="mobileApp">
  <div class="mobileHero">
    <img src="assets/game_world.png?v=mobilefix2" alt="سلامة بطلة اللغة العربية">
    <div class="mobileOverlay"></div>
    <div class="mobileTitle"><h1>تحدي اللغة العربية</h1><p>اختاري بوابتك وابدئي رحلة بطلة السلام.</p></div>
  </div>
  <div class="mobileStats"><div class="mStat">النقاط <strong id="mScore">0</strong></div><div class="mStat">بنك الأسئلة <strong id="mCount">0</strong></div></div>

    <button class="mGate g1" onclick="openGate('reading')"><div><b>الفهم والاستيعاب</b><small>قراءة داخلية وخارجية</small></div><span>📖</span></button>

    <button class="mGate g3" onclick="openGate('vocab')"><div><b>المفردات</b><small>معاني الكلمات والسياق</small></div><span>🔤</span></button>

  </div>
</section>
<section id="panel" class="panel">

    <div id="tipBox" class="tipBox">سلامة ستعطيك تلميحًا قصيرًا بعد السؤال.</div>

  </div>
</section>

let score = Number(localStorage.getItem("mobileFixedArabicScore") || 0), currentGate="mixed", currentItem=null, answered=false;
function updateScore(){document.getElementById("score").textContent=score;document.getElementById("count").textContent=bank.mixed.length;document.getElementById("mScore").textContent=score;document.getElementById("mCount").textContent=bank.mixed.length;} updateScore();
